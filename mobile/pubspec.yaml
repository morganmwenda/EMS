name: ems_mobile
description: Emergency Management System Mobile App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  http: ^1.1.0
  geolocator: ^10.1.0
  permission_handler: ^11.0.1
  flutter_map: ^6.0.1
  latlong2: ^0.8.1
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  firebase_messaging: ^14.7.9
  flutter_local_notifications: ^16.3.0
  url_launcher: ^6.2.1
  camera: ^0.10.5+5
  image_picker: ^1.0.4
  google_sign_in: ^6.1.6
  sign_in_with_apple: ^5.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
  fonts:
    - family: Roboto
      fonts:
        - asset: fonts/Roboto-Regular.ttf
        - asset: fonts/Roboto-Bold.ttf
          weight: 700